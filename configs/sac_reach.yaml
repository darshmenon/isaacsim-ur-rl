algorithm: SAC
policy: MlpPolicy
total_timesteps: 1_000_000
learning_rate: 3.0e-4
buffer_size: 300_000
batch_size: 256
gamma: 0.99
tau: 0.005
ent_coef: auto
train_freq: 1
gradient_steps: 1
learning_starts: 5_000
eval_freq: 20_000
n_eval_episodes: 10

env:
  robot: ur10
  physics_dt: 0.002        # 500 Hz
  rendering_dt: 0.02        # 50 Hz (every 10 physics steps)
  max_episode_steps: 500    # 10 s at 50 Hz
  target_radius: 0.05       # reach threshold (m)
  reach_bonus: 10.0
  joint_limit_penalty: 1.0
  action_scale: 0.3         # rad per step
