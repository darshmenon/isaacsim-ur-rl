# ACT fine-tuning config, consumed by train_act.py (thin wrapper around
# lerobot's `lerobot-train` CLI). Confirm exact flag names against
# `uv run lerobot-train --help` inside the lerobot checkout before running —
# this file tracks the fields that matter for our dataset/policy choice.

dataset:
  repo_id: isaacsim-ur-rl/reach-contact-v0
  root: ./datasets/reach-contact-v0

policy:
  type: act
  chunk_size: 100
  n_action_steps: 100

training:
  output_dir: ./outputs/act_v0
  batch_size: 8
  steps: 20000
  save_freq: 5000
  eval_freq: 5000
  num_workers: 4
  device: cuda
