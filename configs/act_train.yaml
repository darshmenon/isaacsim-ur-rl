# ACT fine-tuning config, consumed by train_act.py (thin wrapper around
# lerobot's `lerobot-train` CLI). Flags verified against
# `.venv312/bin/lerobot-train --help` (there is no bare --eval_freq; closed-
# loop eval is handled separately by run_policy_act.py, not this training
# run, since we don't have a gym env registered for --env_eval_freq).

dataset:
  repo_id: isaacsim-ur-rl/reach-contact-v0
  root: ./datasets/reach-contact-v0

policy:
  type: act
  chunk_size: 100
  n_action_steps: 100

training:
  output_dir: ./outputs/act_v0
  batch_size: 8
  steps: 20000
  save_freq: 5000
  log_freq: 200
  num_workers: 4
  device: cuda
